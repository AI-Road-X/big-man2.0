<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>租车公司模拟</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
      overflow: hidden;
      background: #0a0a0f;
    }

    #canvas-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    #control-panel {
      position: fixed;
      bottom: 24px; right: 24px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 24px 28px;
      min-width: 260px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    #control-panel h2 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #control-panel h2::before {
      content: '';
      width: 8px; height: 8px;
      background: #ff6b35;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .stat:last-of-type { border-bottom: none; }

    .stat:hover {
      background: rgba(255, 255, 255, 0.05);
      margin: 0 -8px;
      padding: 8px 8px;
      border-radius: 8px;
    }

    .stat-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .stat-value.cash { color: #4ade80; }
    .stat-value.fleet { color: #60a5fa; }
    .stat-value.income { color: #fbbf24; }
    .stat-value.expense { color: #f87171; }

    .panel-btn {
      margin-top: 12px;
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .panel-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
    }

    .panel-btn.next-day {
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      margin-top: 8px;
    }

    .panel-btn.next-day:hover {
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }

    .panel-btn.orders {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      margin-top: 8px;
      position: relative;
    }

    .panel-btn.orders:hover {
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }

    .order-badge {
      position: absolute;
      top: -6px; right: -6px;
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      min-width: 20px; height: 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      animation: pulse 1.5s infinite;
    }

    .order-badge:empty { display: none; }

    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #loading-screen.hidden { opacity: 0; visibility: hidden; }

    .loader {
      width: 60px; height: 60px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #ff6b35;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      margin-top: 24px;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      letter-spacing: 2px;
    }

    #info-hint {
      position: fixed;
      bottom: 24px; left: 24px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      animation: fadeIn 1s ease 0.5s both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #info-hint span { color: rgba(255, 255, 255, 0.8); margin-right: 8px; }

    /* 消息栏 */
    #message-log {
      position: fixed;
      top: 24px; left: 24px;
      z-index: 100;
      width: 380px;
      max-height: 320px;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      animation: fadeIn 1s ease 0.8s both;
    }

    .msg-header {
      padding: 12px 18px;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .msg-clear {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: color 0.2s;
      background: none;
      border: none;
      font-family: inherit;
    }

    .msg-clear:hover { color: rgba(255, 255, 255, 0.7); }

    .msg-body {
      max-height: 270px;
      overflow-y: auto;
      padding: 8px 0;
    }

    .msg-body::-webkit-scrollbar { width: 4px; }
    .msg-body::-webkit-scrollbar-track { background: transparent; }
    .msg-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .msg-item {
      padding: 6px 18px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.5;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
      animation: msgSlideIn 0.3s ease;
    }

    @keyframes msgSlideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .msg-item .msg-time {
      color: rgba(255, 255, 255, 0.25);
      margin-right: 6px;
      font-size: 10px;
    }

    .msg-item .msg-highlight { color: #4ade80; font-weight: 600; }
    .msg-item .msg-warn { color: #fbbf24; font-weight: 600; }
    .msg-item .msg-bad { color: #f87171; font-weight: 600; }

    /* 模态框通用 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal-container {
      background: linear-gradient(145deg, #1a1a2e 0%, #0f0f1a 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      width: 100%;
      max-width: 1400px;
      max-height: 90vh;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
      animation: modalSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalSlideUp {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      padding: 24px 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
    }

    .modal-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-title .icon { font-size: 26px; }

    .close-btn {
      width: 40px; height: 40px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      background: rgba(255, 107, 53, 0.2);
      border-color: #ff6b35;
      color: #ff6b35;
      transform: rotate(90deg);
    }

    /* 市场切换标签 */
    .market-tabs {
      display: flex;
      gap: 10px;
      padding: 16px 28px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      overflow-x: auto;
    }

    .market-tab {
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.6);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .market-tab:hover { background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.9); }

    .market-tab.active {
      background: linear-gradient(135deg, var(--tab-color, #3498db) 0%, var(--tab-color-dark, #2980b9) 100%);
      border-color: var(--tab-color, #3498db);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(var(--tab-color-rgb, 52, 152, 219), 0.3);
    }

    .market-tab .badge {
      padding: 2px 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      font-size: 10px;
    }

    .market-info-bar {
      padding: 14px 28px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .market-description { font-size: 12px; color: rgba(255, 255, 255, 0.5); display: flex; align-items: center; gap: 8px; }
    .delivery-time { font-size: 11px; color: rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.05); padding: 5px 10px; border-radius: 8px; }

    /* 车辆表格 */
    .vehicle-table-wrapper {
      max-height: calc(90vh - 260px);
      overflow-y: auto;
      padding: 16px 28px 28px;
    }

    .vehicle-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .vehicle-table thead { position: sticky; top: 0; z-index: 10; }

    .vehicle-table th {
      padding: 12px 14px;
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .vehicle-table th:first-child { border-radius: 10px 0 0 0; }
    .vehicle-table th:last-child { border-radius: 0 10px 0 0; }

    .vehicle-table tbody tr { transition: all 0.2s ease; }
    .vehicle-table tbody tr:hover { background: rgba(255, 255, 255, 0.03); }

    .vehicle-table td {
      padding: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
    }

    .vehicle-info { display: flex; flex-direction: column; gap: 3px; }
    .vehicle-name { font-size: 13px; font-weight: 600; color: #ffffff; }
    .vehicle-brand { font-size: 11px; color: rgba(255, 255, 255, 0.4); }

    .license-plate {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #60a5fa;
      background: rgba(96, 165, 250, 0.1);
      padding: 3px 8px;
      border-radius: 5px;
      display: inline-block;
    }

    .tag { display: inline-flex; align-items: center; gap: 3px; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; }
    .tag-type { background: rgba(52, 152, 219, 0.15); color: #3498db; }
    .tag-fuel { background: rgba(39, 174, 96, 0.15); color: #27ae60; }
    .tag-used { background: rgba(230, 126, 34, 0.15); color: #e67e22; }
    .tag-exclusive { background: rgba(241, 196, 15, 0.15); color: #f1c40f; }

    .residual-value { display: flex; flex-direction: column; gap: 3px; }
    .residual-bar { width: 70px; height: 5px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; }
    .residual-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
    .residual-text { font-size: 10px; color: rgba(255, 255, 255, 0.5); }

    .price { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: #4ade80; }
    .daily-rate { font-size: 12px; color: rgba(255, 255, 255, 0.6); }

    .action-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-buy { background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%); color: #ffffff; }
    .btn-buy:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4); }
    .btn-buy:disabled { background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.3); cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-sell { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); color: #ffffff; }
    .btn-sell:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4); }

    .owned-badge { background: rgba(39, 174, 96, 0.2); color: #2ecc71; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 600; }

    .condition-tag { padding: 2px 6px; border-radius: 5px; font-size: 10px; font-weight: 500; }
    .condition-excellent { background: rgba(39, 174, 96, 0.2); color: #2ecc71; }
    .condition-good { background: rgba(52, 152, 219, 0.2); color: #3498db; }
    .condition-average { background: rgba(241, 196, 15, 0.2); color: #f1c40f; }
    .condition-poor { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }

    /* Toast */
    .toast {
      position: fixed;
      top: 24px; left: 50%;
      transform: translateX(-50%) translateY(-100px);
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { background: linear-gradient(135deg, #27ae60, #2ecc71); color: #fff; box-shadow: 0 10px 40px rgba(39, 174, 96, 0.4); }
    .toast.error { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; box-shadow: 0 10px 40px rgba(231, 76, 60, 0.4); }
    .toast.warning { background: linear-gradient(135deg, #f39c12, #e67e22); color: #fff; box-shadow: 0 10px 40px rgba(243, 156, 18, 0.4); }

    /* 统计卡片 */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 16px 28px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-card-label { font-size: 10px; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card-value { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: #ffffff; }
    .stat-card-value.green { color: #4ade80; }
    .stat-card-value.blue { color: #60a5fa; }
    .stat-card-value.orange { color: #fb923c; }
    .stat-card-value.purple { color: #a78bfa; }

    .empty-state { padding: 50px 20px; text-align: center; color: rgba(255, 255, 255, 0.4); }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state .text { font-size: 13px; }

    /* 订单模态框 */
    .order-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 18px 22px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }

    .order-card:hover { background: rgba(255, 255, 255, 0.06); }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .order-customer {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .order-avatar {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .order-avatar.business { background: rgba(59, 130, 246, 0.2); }
    .order-avatar.tourist { background: rgba(16, 185, 129, 0.2); }

    .order-customer-info { display: flex; flex-direction: column; gap: 2px; }
    .order-customer-name { font-size: 13px; font-weight: 600; color: #ffffff; }
    .order-customer-type { font-size: 11px; color: rgba(255, 255, 255, 0.4); }

    .order-price { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: #4ade80; }

    .order-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .order-detail-item {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .order-detail-label { font-size: 10px; color: rgba(255, 255, 255, 0.35); margin-bottom: 2px; }
    .order-detail-value { font-size: 12px; color: rgba(255, 255, 255, 0.7); font-weight: 500; }

    .order-actions {
      display: flex;
      gap: 8px;
    }

    .order-actions .action-btn { flex: 1; padding: 10px; text-align: center; }

    .btn-accept { background: linear-gradient(135deg, #27ae60, #2ecc71); color: #fff; }
    .btn-accept:hover { box-shadow: 0 4px 16px rgba(39, 174, 96, 0.4); transform: translateY(-1px); }

    .btn-reject { background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-reject:hover { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border-color: #e74c3c; }

    .order-list-wrapper {
      max-height: calc(90vh - 120px);
      overflow-y: auto;
      padding: 20px 28px 28px;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loader"></div>
    <div class="loading-text">INITIALIZING</div>
  </div>

  <div id="canvas-container"></div>

  <!-- 消息栏 -->
  <div id="message-log">
    <div class="msg-header">
      <span>📋 经营日志</span>
      <button class="msg-clear" onclick="clearMessages()">清空</button>
    </div>
    <div class="msg-body" id="messageBody"></div>
  </div>

  <!-- 右下角控制面板 -->
  <div id="control-panel">
    <h2>租车公司</h2>
    <div class="stat">
      <span class="stat-label">第 N 天</span>
      <span class="stat-value" id="dayDisplay">第 1 天</span>
    </div>
    <div class="stat">
      <span class="stat-label">公司现金</span>
      <span class="stat-value cash" id="cash">¥1,000,000</span>
    </div>
    <div class="stat">
      <span class="stat-label">总车队数量</span>
      <span class="stat-value fleet" id="fleet">0 辆</span>
    </div>
    <div class="stat">
      <span class="stat-label">今日收入</span>
      <span class="stat-value income" id="todayIncome">¥0</span>
    </div>
    <div class="stat">
      <span class="stat-label">今日支出</span>
      <span class="stat-value expense" id="todayExpense">¥0</span>
    </div>
    <button class="panel-btn next-day" onclick="nextDay()">⏭ 下一日</button>
    <button class="panel-btn orders" onclick="openOrdersModal()">
      📋 待处理订单
      <span class="order-badge" id="orderBadge"></span>
    </button>

  <div id="info-hint">

  </div>

  <!-- 车队管理模态框 -->
  <div class="modal-overlay" id="fleetModal">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-title"><span class="icon">🚗</span> 车队管理系统</div>

      </div>
      <div class="stats-row">
        <div class="stat-card"><span class="stat-card-label">公司现金</span><span class="stat-card-value green" id="modalCash">¥1,000,000</span></div>
        <div class="stat-card"><span class="stat-card-label">我的车队</span><span class="stat-card-value blue" id="modalFleet">0 辆</span></div>
        <div class="stat-card"><span class="stat-card-label">日均收入</span><span class="stat-card-value orange" id="modalRevenue">¥0</span></div>
        <div class="stat-card"><span class="stat-card-label">日均成本</span><span class="stat-card-value purple" id="modalCost">¥0</span></div>

        <button class="market-tab" data-tab="used" onclick="switchTab('used')" style="--tab-color:#e67e22;--tab-color-dark:#d35400;--tab-color-rgb:230,126,34;">🚗 二手车市场 <span class="badge" id="usedCount">12辆</span></button>
        <button class="market-tab" data-tab="overseas" onclick="switchTab('overseas')" style="--tab-color:#9b59b6;--tab-color-dark:#8e44ad;--tab-color-rgb:155,89,182;">🌍 海外进口市场 <span class="badge" id="overseasCount">12辆</span></button>
        <button class="market-tab" data-tab="myfleet" onclick="switchTab('myfleet')" style="--tab-color:#2ecc71;--tab-color-dark:#27ae60;--tab-color-rgb:46,204,113;">📋 我的车队 <span class="badge" id="myFleetCount">0辆</span></button>
      </div>
      <div class="market-info-bar" id="marketInfoBar">
        <div class="market-description" id="marketDescription">批量采购享95折优惠，即时交付</div>

      </div>

        <table class="vehicle-table" id="vehicleTable">
          <thead><tr><th>车型信息</th><th>车牌</th><th>类型</th><th>保值率</th><th>采购价格</th><th>日租金</th><th>操作</th></tr></thead>
          <tbody id="vehicleTableBody"></tbody>
        </table>
      </div>

  <!-- 订单管理模态框 -->
  <div class="modal-overlay" id="ordersModal">
    <div class="modal-container" style="max-width:700px;">
      <div class="modal-header">
        <div class="modal-title"><span class="icon">📋</span> 待处理订单</div>
        <button class="close-btn" onclick="closeOrdersModal()">✕</button>
      </div>
      <div class="order-list-wrapper" id="orderListWrapper">
        <div class="empty-state"><div class="icon">📭</div><div class="text">暂无待处理订单</div></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="vehicles.js"></script>

  <script>
    const SAVE_KEY = 'rentalCompanyGame';

    const CUSTOMER_NAMES_BUSINESS = ['王经理','李总','张董','陈主管','刘总监','赵助理','周客户','吴商务','郑代表','孙顾问','朱行长','马主任','胡总裁','林经理','何总监'];
    const CUSTOMER_NAMES_TOURIST = ['小王','阿李','张同学','陈先生','刘女士','赵一家','周游客','吴旅人','郑背包客','孙家庭','朱度假','马旅行','胡探险','林观光','何周末'];

    const OUTLET_CONFIGS = [
      { id: 0, name: '网点 A', citySize: 'large', cityLabel: '大型城市' },
      { id: 1, name: '网点 B', citySize: 'medium', cityLabel: '中型城市' },
      { id: 2, name: '网点 C', citySize: 'large', cityLabel: '大型城市' },
      { id: 3, name: '网点 D', citySize: 'small', cityLabel: '小型城市' },
      { id: 4, name: '网点 E', citySize: 'medium', cityLabel: '中型城市' }
    ];

    const CITY_SIZE_MULTIPLIERS = { small: 0.6, medium: 1.0, large: 1.5 };
    const CUSTOMER_TYPE_PREFS = {
      business: { '轿车': 3, 'SUV': 1.5, 'MPV': 2, '豪华车': 2.5, '跑车': 1, '超跑': 0.5, '紧凑型': 1 },
      tourist:  { '轿车': 1, 'SUV': 3, 'MPV': 2.5, '豪华车': 1, '跑车': 1.5, '超跑': 0.5, '紧凑型': 2 }
    };

    const defaultGameState = {
      cash: 1000000,
      totalFleet: 0,
      currentDay: 1,
      outlets: [],
      ownedVehicles: [],
      pendingOrders: [],
      todayIncome: 0,
      todayExpense: 0,
      marketPriceFactor: 1.0,
      messages: [],
      rentedToday: []
    };

    let gameState = JSON.parse(JSON.stringify(defaultGameState));

    const outletColors = [0x3498db, 0xe74c3c, 0x2ecc71, 0xf39c12, 0x9b59b6];
    const outletNames = ['网点 A', '网点 B', '网点 C', '网点 D', '网点 E'];

    let scene, camera, renderer, controls;
    const outlets = [];
    let currentTab = 'local';

    function saveGame() {
      try {
        const data = JSON.parse(JSON.stringify(gameState));
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      } catch (e) { console.error('保存失败:', e); }
    }

    function loadGame() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          gameState = { ...JSON.parse(JSON.stringify(defaultGameState)), ...data };
          return true;
        }
      } catch (e) { console.error('加载失败:', e); }
      return false;
    }

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a0f);
      scene.fog = new THREE.Fog(0x0a0a0f, 80, 200);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(80, 80, 80);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 30;
      controls.maxDistance = 200;
      controls.maxPolarAngle = Math.PI / 2.2;

      createLighting();
      createGround();
      createOutlets();

      window.addEventListener('resize', onWindowResize);
      setTimeout(() => { document.getElementById('loading-screen').classList.add('hidden'); }, 800);
      animate();
    }

    function createLighting() {
      scene.add(new THREE.AmbientLight(0xffffff, 0.4));
      const dl = new THREE.DirectionalLight(0xffffff, 0.8);
      dl.position.set(50, 100, 50);
      dl.castShadow = true;
      dl.shadow.mapSize.width = 2048;
      dl.shadow.mapSize.height = 2048;
      dl.shadow.camera.near = 0.5;
      dl.shadow.camera.far = 500;
      scene.add(dl);
      const fl = new THREE.DirectionalLight(0x4a90e2, 0.3);
      fl.position.set(-30, 50, -30);
      scene.add(fl);
    }

    function createGround() {
      const g = new THREE.Mesh(new THREE.PlaneGeometry(200, 200, 50, 50), new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.8, metalness: 0.2 }));
      g.rotation.x = -Math.PI / 2;
      g.receiveShadow = true;
      scene.add(g);
      const gh = new THREE.GridHelper(200, 40, 0x2a2a4e, 0x1a1a3e);
      gh.position.y = 0.01;
      scene.add(gh);
      const glm = new THREE.LineBasicMaterial({ color: 0x3498db, transparent: true, opacity: 0.1 });
      const glg = new THREE.BufferGeometry();
      const lines = [];
      const sz = 200, div = 20, step = sz / div;
      for (let i = -sz/2; i <= sz/2; i += step) {
        lines.push(-sz/2, 0.02, i, sz/2, 0.02, i, i, 0.02, -sz/2, i, 0.02, sz/2);
      }
      glg.setAttribute('position', new THREE.Float32BufferAttribute(lines, 3));
      scene.add(new THREE.LineSegments(glg, glm));
    }

    function createOutlets() {
      const existingPositions = [];
      outletNames.forEach((name, index) => {
        let position = generateRandomPosition(existingPositions, 30);
        existingPositions.push(position);

        const cg = new THREE.BoxGeometry(10, 10, 10);
        const cm = new THREE.MeshStandardMaterial({ color: outletColors[index], roughness: 0.3, metalness: 0.6, emissive: outletColors[index], emissiveIntensity: 0.1 });
        const cube = new THREE.Mesh(cg, cm);
        cube.position.set(position.x, 5, position.z);
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);

        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(cg), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 }));
        cube.add(edges);

        const glow = new THREE.Mesh(new THREE.BoxGeometry(11, 11, 11), new THREE.MeshBasicMaterial({ color: outletColors[index], transparent: true, opacity: 0.15, side: THREE.BackSide }));
        glow.position.set(position.x, 5, position.z);
        scene.add(glow);

        const sprite = createTextSprite(name, '#ffffff');
        sprite.position.set(position.x, 18, position.z);
        sprite.scale.set(20, 10, 1);
        scene.add(sprite);

        const iconSprite = createTextSprite('🏢', null);
        iconSprite.position.set(position.x, 14, position.z);
        iconSprite.scale.set(8, 8, 1);
        scene.add(iconSprite);

        outlets.push({ mesh: cube, position, name, color: outletColors[index] });

        if (!gameState.outlets[index]) {
          gameState.outlets.push({ id: index, name, position, vehicles: 0, ...OUTLET_CONFIGS[index] });
        }
      });
    }

    function generateRandomPosition(existingPositions, minDistance) {
      let position, attempts = 0;
      do {
        position = { x: Math.random() * 80 - 40, z: Math.random() * 80 - 40 };
        attempts++;
      } while (isTooClose(position, existingPositions, minDistance) && attempts < 100);
      return position;
    }

    function isTooClose(pos, existing, min) {
      return existing.some(e => Math.sqrt((pos.x - e.x) ** 2 + (pos.z - e.z) ** 2) < min);
    }

    function createTextSprite(text, color) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512; canvas.height = 256;
      ctx.fillStyle = color || 'transparent';
      ctx.font = 'bold 72px "Microsoft YaHei", "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function formatCurrency(amount) { return '¥' + amount.toLocaleString('zh-CN'); }

    function updateUI() {
      document.getElementById('dayDisplay').textContent = '第 ' + gameState.currentDay + ' 天';
      document.getElementById('cash').textContent = formatCurrency(gameState.cash);
      document.getElementById('fleet').textContent = gameState.totalFleet + ' 辆';
      document.getElementById('todayIncome').textContent = formatCurrency(gameState.todayIncome);
      document.getElementById('todayExpense').textContent = formatCurrency(gameState.todayExpense);
      document.getElementById('modalCash').textContent = formatCurrency(gameState.cash);
      document.getElementById('modalFleet').textContent = gameState.totalFleet + ' 辆';
      document.getElementById('myFleetCount').textContent = gameState.totalFleet + '辆';

      const rev = gameState.ownedVehicles.reduce((s, v) => s + v.dailyRate, 0);
      const cost = gameState.ownedVehicles.reduce((s, v) => s + v.fuelCostPerDay + v.maintenanceCostPerDay, 0);
      document.getElementById('modalRevenue').textContent = formatCurrency(rev);
      document.getElementById('modalCost').textContent = formatCurrency(cost);

      const badge = document.getElementById('orderBadge');
      badge.textContent = gameState.pendingOrders.length || '';
    }

    function addMessage(text, type = 'normal') {
      const time = 'D' + gameState.currentDay;
      gameState.messages.unshift({ time, text, type });
      if (gameState.messages.length > 100) gameState.messages.length = 100;
      renderMessages();
      saveGame();
    }

    function renderMessages() {
      const body = document.getElementById('messageBody');
      body.innerHTML = '';
      const show = gameState.messages.slice(0, 50);
      show.forEach(m => {
        const div = document.createElement('div');
        div.className = 'msg-item';
        const cls = m.type === 'good' ? 'msg-highlight' : m.type === 'warn' ? 'msg-warn' : m.type === 'bad' ? 'msg-bad' : '';
        div.innerHTML = `<span class="msg-time">[${m.time}]</span> <span class="${cls}">${m.text}</span>`;
        body.appendChild(div);
      });
    }

    function clearMessages() {
      gameState.messages = [];
      renderMessages();
      saveGame();
    }

    // ===== 经营模拟核心 =====
    function generateCustomers() {
      const customers = [];
      gameState.outlets.forEach(outlet => {
        const cfg = OUTLET_CONFIGS[outlet.id] || OUTLET_CONFIGS[0];
        const mult = CITY_SIZE_MULTIPLIERS[cfg.citySize] || 1;
        const base = Math.floor(Math.random() * 10 * mult) + 1;
        const count = Math.min(base, 10);

        for (let i = 0; i < count; i++) {
          const isBusiness = Math.random() < 0.45;
          const type = isBusiness ? 'business' : 'tourist';
          const names = isBusiness ? CUSTOMER_NAMES_BUSINESS : CUSTOMER_NAMES_TOURIST;
          const name = names[Math.floor(Math.random() * names.length)];
          customers.push({
            id: 'C' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            name,
            type,
            outletId: outlet.id,
            outletName: outlet.name || cfg.name,
            preferences: CUSTOMER_TYPE_PREFS[type]
          });
        }
      });
      return customers;
    }

    function matchVehicleForCustomer(customer) {
      const available = gameState.ownedVehicles.filter(v => !gameState.rentedToday.includes(v.id));
      if (available.length === 0) return null;

      const scored = available.map(v => {
        const pref = customer.preferences[v.type] || 1;
        const effectiveRate = v.dailyRate * gameState.marketPriceFactor;
        const score = pref * (1000 / Math.max(effectiveRate, 1));
        return { vehicle: v, score, effectiveRate };
      });

      scored.sort((a, b) => b.score - a.score);
      return scored[0];
    }

    function nextDay() {
      gameState.todayIncome = 0;
      gameState.todayExpense = 0;
      gameState.rentedToday = [];

      const customers = generateCustomers();
      addMessage(`今日到店客户共 <span class="msg-highlight">${customers.length}</span> 人`, 'good');

      const newOrders = [];
      customers.forEach(customer => {
        const match = matchVehicleForCustomer(customer);
        if (match) {
          const order = {
            id: 'O' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
            customerId: customer.id,
            customerName: customer.name,
            customerType: customer.type,
            outletId: customer.outletId,
            outletName: customer.outletName,
            vehicleId: match.vehicle.id,
            vehicleName: match.vehicle.brand + ' ' + match.vehicle.model,
            vehicleType: match.vehicle.type,
            dailyRate: match.effectiveRate,
            fuelCost: match.vehicle.fuelCostPerDay,
            maintenanceCost: match.vehicle.maintenanceCostPerDay,
            netIncome: match.effectiveRate - match.vehicle.fuelCostPerDay - match.vehicle.maintenanceCostPerDay,
            createdDay: gameState.currentDay
          };
          newOrders.push(order);
        }
      });

      if (newOrders.length > 0) {
        gameState.pendingOrders = gameState.pendingOrders.concat(newOrders);
        addMessage(`收到 <span class="msg-highlight">${newOrders.length}</span> 个新订单，请及时处理！`, 'warn');
      } else {
        addMessage('今日无客户下单', 'bad');
      }

      const dailyCost = gameState.ownedVehicles.reduce((s, v) => s + v.fuelCostPerDay + v.maintenanceCostPerDay, 0) * 0.3;
      gameState.todayExpense += Math.round(dailyCost);
      gameState.cash -= Math.round(dailyCost);

      gameState.currentDay++;
      updateUI();
      saveGame();
    }

    function acceptOrder(orderId) {
      const idx = gameState.pendingOrders.findIndex(o => o.id === orderId);
      if (idx === -1) return;

      const order = gameState.pendingOrders[idx];
      const vehicle = gameState.ownedVehicles.find(v => v.id === order.vehicleId);

      if (!vehicle) {
        addMessage(`订单取消：${order.vehicleName} 已出售`, 'bad');
        gameState.pendingOrders.splice(idx, 1);
        renderOrders();
        updateUI();
        saveGame();
        return;
      }

      if (gameState.rentedToday.includes(order.vehicleId)) {
        addMessage(`订单取消：${order.vehicleName} 今日已租出`, 'bad');
        gameState.pendingOrders.splice(idx, 1);
        renderOrders();
        saveGame();
        return;
      }

      gameState.cash += Math.round(order.dailyRate);
      gameState.todayIncome += Math.round(order.dailyRate);
      gameState.cash -= Math.round(order.fuelCost + order.maintenanceCost);
      gameState.todayExpense += Math.round(order.fuelCost + order.maintenanceCost);
      gameState.rentedToday.push(order.vehicleId);

      gameState.pendingOrders.splice(idx, 1);

      const typeLabel = order.customerType === 'business' ? '商务' : '旅游';
      addMessage(`${typeLabel}客户 <span class="msg-highlight">${order.customerName}</span> 租用了 ${order.vehicleName}，收入 ${formatCurrency(Math.round(order.dailyRate))}`, 'good');

      renderOrders();
      updateUI();
      saveGame();
    }

    function rejectOrder(orderId) {
      const idx = gameState.pendingOrders.findIndex(o => o.id === orderId);
      if (idx === -1) return;
      const order = gameState.pendingOrders[idx];
      gameState.pendingOrders.splice(idx, 1);
      addMessage(`已拒绝 ${order.customerName} 的租车订单`, 'bad');
      renderOrders();
      updateUI();
      saveGame();
    }

    // ===== 订单管理 =====
    function openOrdersModal() {
      document.getElementById('ordersModal').classList.add('active');
      renderOrders();
    }

    function closeOrdersModal() {
      document.getElementById('ordersModal').classList.remove('active');
    }

    function renderOrders() {
      const wrapper = document.getElementById('orderListWrapper');
      if (gameState.pendingOrders.length === 0) {
        wrapper.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div class="text">暂无待处理订单</div></div>';
        return;
      }

      wrapper.innerHTML = '';
      gameState.pendingOrders.forEach(order => {
        const typeIcon = order.customerType === 'business' ? '💼' : '🏖️';
        const typeClass = order.customerType === 'business' ? 'business' : 'tourist';
        const typeLabel = order.customerType === 'business' ? '商务客户' : '旅游客户';
        const netClass = order.netIncome >= 0 ? 'msg-highlight' : 'msg-bad';

        const card = document.createElement('div');
        card.className = 'order-card';
        card.innerHTML = `
          <div class="order-top">
            <div class="order-customer">
              <div class="order-avatar ${typeClass}">${typeIcon}</div>
              <div class="order-customer-info">
                <span class="order-customer-name">${order.customerName}</span>
                <span class="order-customer-type">${typeLabel} · ${order.outletName}</span>
              </div>
            </div>
            <span class="order-price">${formatCurrency(Math.round(order.dailyRate))}</span>
          </div>
          <div class="order-details">
            <div class="order-detail-item">
              <div class="order-detail-label">租用车型</div>
              <div class="order-detail-value">${order.vehicleName}</div>
            </div>
            <div class="order-detail-item">
              <div class="order-detail-label">车辆类型</div>
              <div class="order-detail-value">${order.vehicleType}</div>
            </div>
            <div class="order-detail-item">
              <div class="order-detail-label">净利润</div>
              <div class="order-detail-value ${netClass}">${formatCurrency(Math.round(order.netIncome))}</div>
            </div>
          </div>
          <div class="order-actions">
            <button class="action-btn btn-accept" onclick="acceptOrder('${order.id}')">✓ 接单</button>
            <button class="action-btn btn-reject" onclick="rejectOrder('${order.id}')">✕ 拒绝</button>
          </div>
        `;
        wrapper.appendChild(card);
      });
    }

    // ===== 车队管理 =====
    function openFleetModal() {
      document.getElementById('fleetModal').classList.add('active');
      updateVehicleCounts();
      switchTab('local');
    }

    function closeFleetModal() { document.getElementById('fleetModal').classList.remove('active'); }

    function updateVehicleCounts() {
      document.getElementById('localCount').textContent = getVehiclesByMarket(MARKET_TYPES.LOCAL_DEALER).length + '辆';
      document.getElementById('usedCount').textContent = getVehiclesByMarket(MARKET_TYPES.USED_CAR).length + '辆';
      document.getElementById('overseasCount').textContent = getVehiclesByMarket(MARKET_TYPES.OVERSEAS).length + '辆';
      document.getElementById('myFleetCount').textContent = gameState.totalFleet + '辆';
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.market-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      const marketInfo = getMarketInfo();
      const infoBar = document.getElementById('marketInfoBar');
      const descEl = document.getElementById('marketDescription');
      const timeEl = document.getElementById('deliveryTime');

      if (tab === 'myfleet') {
        infoBar.style.display = 'none';
        renderMyFleet();
      } else {
        infoBar.style.display = 'flex';
        const market = marketInfo[tab];
        descEl.innerHTML = market.icon + ' ' + market.description;
        timeEl.textContent = '⏱️ ' + market.deliveryTime;
        if (tab === MARKET_TYPES.LOCAL_DEALER) renderVehicles(getVehiclesByMarket(MARKET_TYPES.LOCAL_DEALER), 'buy');
        else if (tab === MARKET_TYPES.USED_CAR) renderUsedCars(getVehiclesByMarket(MARKET_TYPES.USED_CAR));
        else if (tab === MARKET_TYPES.OVERSEAS) renderVehicles(getVehiclesByMarket(MARKET_TYPES.OVERSEAS), 'buy');
      }
    }

    function renderVehicles(vehicles, action) {
      const tbody = document.getElementById('vehicleTableBody');
      tbody.innerHTML = '';
      vehicles.forEach(v => {
        const fuelInfo = getFuelTypeInfo(v.fuelType);
        const typeInfo = getVehicleTypeInfo(v.type);
        const residualInfo = getResidualValueInfo(v.residualValue);
        const isOwned = gameState.ownedVehicles.some(o => o.id === v.id);
        const canAfford = gameState.cash >= v.purchasePrice;
        let actionHtml = '';
        if (action === 'buy') {
          actionHtml = `<button class="action-btn btn-buy" onclick="buyVehicle('${v.id}')" ${!canAfford || isOwned ? 'disabled' : ''}>${isOwned ? '已拥有' : (canAfford ? '购买' : '资金不足')}</button>`;
        }
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><div class="vehicle-info"><span class="vehicle-name">${v.brand} ${v.model}</span><span class="vehicle-brand">${v.year}款 · ${v.fuelConsumption}${v.fuelType === FUEL_TYPES.ELECTRIC ? 'kWh' : 'L'}/100km</span></div></td>
          <td><span class="license-plate">${v.licensePlate}</span></td>
          <td><span class="tag tag-type">${typeInfo.text}</span> <span class="tag tag-fuel">${fuelInfo.icon} ${fuelInfo.text}</span>${v.isExclusive ? ' <span class="tag tag-exclusive">⭐ 独家</span>' : ''}</td>
          <td><div class="residual-value"><div class="residual-bar"><div class="residual-fill" style="width:${residualInfo.percentage}%;background:${residualInfo.color};"></div></div><span class="residual-text" style="color:${residualInfo.color};">${residualInfo.percentage}% · ${residualInfo.level}</span></div></td>
          <td><span class="price">${formatCurrency(v.purchasePrice)}</span></td>
          <td><span class="daily-rate">${formatCurrency(v.dailyRate)}/天</span></td>
          <td>${actionHtml}</td>`;
        tbody.appendChild(row);
      });
    }

    function renderUsedCars(vehicles) {
      const tbody = document.getElementById('vehicleTableBody');
      tbody.innerHTML = '';
      vehicles.forEach(v => {
        const fuelInfo = getFuelTypeInfo(v.fuelType);
        const typeInfo = getVehicleTypeInfo(v.type);
        const residualInfo = getResidualValueInfo(v.residualValue);
        const isOwned = gameState.ownedVehicles.some(o => o.id === v.id);
        const currentValue = calculateVehicleValue(v);
        const canAfford = gameState.cash >= currentValue;
        let cc = 'condition-good';
        if (v.condition === CONDITION_LEVELS.EXCELLENT) cc = 'condition-excellent';
        else if (v.condition === CONDITION_LEVELS.AVERAGE) cc = 'condition-average';
        else if (v.condition === CONDITION_LEVELS.POOR) cc = 'condition-poor';
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><div class="vehicle-info"><span class="vehicle-name">${v.brand} ${v.model}</span><span class="vehicle-brand">${v.year}款 · ${v.mileage.toLocaleString()}km · ${v.age}年车龄</span></div></td>
          <td><span class="license-plate">${v.licensePlate}</span></td>
          <td><span class="tag tag-type">${typeInfo.text}</span> <span class="tag tag-fuel">${fuelInfo.icon} ${fuelInfo.text}</span> <span class="tag tag-used">二手车</span> <span class="condition-tag ${cc}">${v.condition}</span></td>
          <td><div class="residual-value"><div class="residual-bar"><div class="residual-fill" style="width:${residualInfo.percentage}%;background:${residualInfo.color};"></div></div><span class="residual-text" style="color:${residualInfo.color};">${residualInfo.percentage}% · ${residualInfo.level}</span></div></td>
          <td><span class="price">${formatCurrency(currentValue)}</span></td>
          <td><span class="daily-rate">${formatCurrency(v.dailyRate)}/天</span></td>
          <td><button class="action-btn btn-buy" onclick="buyVehicle('${v.id}',true)" ${!canAfford || isOwned ? 'disabled' : ''}>${isOwned ? '已拥有' : (canAfford ? '购买' : '资金不足')}</button></td>`;
        tbody.appendChild(row);
      });
    }

    function renderMyFleet() {
      const tbody = document.getElementById('vehicleTableBody');
      if (gameState.ownedVehicles.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="icon">🚗</div><div class="text">暂无车辆，前往市场购买吧！</div></div></td></tr>';
        return;
      }
      tbody.innerHTML = '';
      gameState.ownedVehicles.forEach(v => {
        const fuelInfo = getFuelTypeInfo(v.fuelType);
        const typeInfo = getVehicleTypeInfo(v.type);
        const currentValue = calculateVehicleValue(v);
        const sellPrice = Math.round(currentValue * 0.85);
        let condHtml = '';
        if (!v.isNew) {
          let cc = 'condition-good';
          if (v.condition === CONDITION_LEVELS.EXCELLENT) cc = 'condition-excellent';
          else if (v.condition === CONDITION_LEVELS.AVERAGE) cc = 'condition-average';
          else if (v.condition === CONDITION_LEVELS.POOR) cc = 'condition-poor';
          condHtml = `<span class="condition-tag ${cc}">${v.condition}</span>`;
        }
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><div class="vehicle-info"><span class="vehicle-name">${v.brand} ${v.model}</span><span class="vehicle-brand">${v.year}款 · ${v.isNew ? '新车' : v.mileage.toLocaleString() + 'km'}</span></div></td>
          <td><span class="license-plate">${v.licensePlate}</span></td>
          <td><span class="tag tag-type">${typeInfo.text}</span> <span class="tag tag-fuel">${fuelInfo.icon} ${fuelInfo.text}</span> <span class="owned-badge">已购入</span>${condHtml}</td>
          <td><span style="color:#60a5fa;">估值 ${formatCurrency(currentValue)}</span></td>
          <td><span class="price">${formatCurrency(sellPrice)}</span></td>
          <td><span class="daily-rate">${formatCurrency(v.dailyRate)}/天</span></td>
          <td><button class="action-btn btn-sell" onclick="sellVehicle('${v.id}')">出售</button></td>`;
        tbody.appendChild(row);
      });
    }

    function buyVehicle(vehicleId, isUsed = false) {
      const vehicle = getVehicleById(vehicleId);
      if (!vehicle) return;
      const purchasePrice = isUsed ? calculateVehicleValue(vehicle) : vehicle.purchasePrice;
      if (gameState.cash < purchasePrice) { showToast('资金不足，无法购买！', 'error'); return; }
      if (gameState.ownedVehicles.some(v => v.id === vehicle.id)) { showToast('该车辆已在车队中！', 'warning'); return; }

      gameState.cash -= purchasePrice;
      gameState.totalFleet += 1;
      gameState.ownedVehicles.push({ ...vehicle, purchasePrice, purchaseDate: new Date().toISOString() });

      addMessage(`购入 ${vehicle.brand} ${vehicle.model}，花费 ${formatCurrency(purchasePrice)}`, 'good');
      updateUI();
      updateVehicleCounts();
      switchTab(currentTab);
      showToast(`成功购买 ${vehicle.brand} ${vehicle.model}！- ${formatCurrency(purchasePrice)}`, 'success');
    }

    function sellVehicle(vehicleId) {
      const index = gameState.ownedVehicles.findIndex(v => v.id === vehicleId);
      if (index === -1) return;
      const vehicle = gameState.ownedVehicles[index];
      const currentValue = calculateVehicleValue(vehicle);
      const sellPrice = Math.round(currentValue * 0.85);

      gameState.cash += sellPrice;
      gameState.totalFleet -= 1;
      gameState.ownedVehicles.splice(index, 1);

      gameState.pendingOrders = gameState.pendingOrders.filter(o => o.vehicleId !== vehicleId);

      addMessage(`出售 ${vehicle.brand} ${vehicle.model}，获得 ${formatCurrency(sellPrice)}`, 'warn');
      updateUI();
      updateVehicleCounts();
      switchTab('myfleet');
      showToast(`成功出售 ${vehicle.brand} ${vehicle.model}！+ ${formatCurrency(sellPrice)}`, 'success');
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.className = 'toast ' + type;
      toast.innerHTML = type === 'success' ? '✓ ' + message : type === 'error' ? '✕ ' + message : '⚠ ' + message;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeFleetModal(); closeOrdersModal(); }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const loaded = loadGame();
      init();
      if (loaded && gameState.messages.length > 0) {
        renderMessages();
      } else {
        addMessage('欢迎来到租车公司模拟！点击「下一日」开始经营', 'good');
      }
      if (!gameState.rentedToday) gameState.rentedToday = [];
      if (!gameState.pendingOrders) gameState.pendingOrders = [];
      updateUI();
    });
  </script>
</body>
</html>
