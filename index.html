<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>租车公司模拟</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'JetBrains Mono','Noto Sans SC',monospace;overflow:hidden;background:#0a0a0f;-webkit-tap-highlight-color:transparent}
    #canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}

    #control-panel{position:fixed;bottom:16px;right:16px;z-index:100;background:rgba(255,255,255,0.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.18);border-radius:16px;padding:16px 18px;min-width:220px;box-shadow:0 8px 32px rgba(0,0,0,0.4);animation:slideIn .6s cubic-bezier(.16,1,.3,1)}
    @keyframes slideIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
    #control-panel h2{font-size:14px;font-weight:700;color:#fff;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid rgba(255,255,255,0.1);display:flex;align-items:center;gap:8px}
    #control-panel h2::before{content:'';width:6px;height:6px;background:#ff6b35;border-radius:50%;animation:pulse 2s infinite}
    .stat{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
    .stat:last-of-type{border-bottom:none}
    .stat-label{font-size:11px;color:rgba(255,255,255,0.6);letter-spacing:.5px}
    .stat-value{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#fff}
    .stat-value.cash{color:#4ade80}.stat-value.fleet{color:#60a5fa}.stat-value.income{color:#fbbf24}.stat-value.expense{color:#f87171}
    .panel-btn{margin-top:6px;width:100%;padding:10px 14px;border:none;border-radius:8px;color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;transition:all .3s ease;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
    .panel-btn:hover{transform:translateY(-2px)}
    .panel-btn.next-day{background:linear-gradient(135deg,#3b82f6,#6366f1)}
    .panel-btn.next-day:hover{box-shadow:0 6px 20px rgba(59,130,246,0.4)}
    .panel-btn.orders{background:linear-gradient(135deg,#f59e0b,#d97706);position:relative}
    .panel-btn.orders:hover{box-shadow:0 6px 20px rgba(245,158,11,0.4)}
    .panel-btn.fleet{background:linear-gradient(135deg,#ff6b35,#f7931e)}
    .panel-btn.fleet:hover{box-shadow:0 6px 20px rgba(255,107,53,0.4)}
    .panel-btn.pricing{background:linear-gradient(135deg,#9b59b6,#8e44ad)}
    .panel-btn.pricing:hover{box-shadow:0 6px 20px rgba(155,89,182,0.4)}
    .order-badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;animation:pulse 1.5s infinite}
    .order-badge:empty{display:none}
    #activeEventsBar{display:none;flex-wrap:wrap;gap:4px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.08)}
    .event-tag{font-size:10px;padding:3px 8px;border-radius:6px;background:rgba(251,191,36,0.15);color:#fbbf24;white-space:nowrap}
    #marketCoeffDisplay{font-size:10px;color:rgba(255,255,255,0.6);text-align:center;margin-top:4px}

    #loading-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a0f;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;transition:opacity .8s ease,visibility .8s ease}
    #loading-screen.hidden{opacity:0;visibility:hidden}
    .loader{width:50px;height:50px;border:3px solid rgba(255,255,255,0.1);border-top-color:#ff6b35;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{margin-top:20px;font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,0.6);font-size:13px;letter-spacing:2px}

    #message-log{position:fixed;top:16px;left:16px;z-index:100;width:340px;max-height:280px;background:rgba(10,10,15,0.9);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden;animation:fadeIn 1s ease .8s both}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .msg-header{padding:10px 14px;font-size:11px;font-weight:700;color:rgba(255,255,255,0.5);border-bottom:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:1px}
    .msg-clear{font-size:10px;color:rgba(255,255,255,0.3);cursor:pointer;transition:color .2s;background:none;border:none;font-family:inherit;min-height:28px;min-width:44px}
    .msg-clear:hover{color:rgba(255,255,255,0.7)}
    .msg-body{max-height:230px;overflow-y:auto;padding:6px 0}
    .msg-body::-webkit-scrollbar{width:3px}.msg-body::-webkit-scrollbar-track{background:transparent}.msg-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
    .msg-item{padding:5px 14px;font-size:11px;color:rgba(255,255,255,0.55);line-height:1.5;border-bottom:1px solid rgba(255,255,255,0.02);animation:msgSlideIn .3s ease}
    @keyframes msgSlideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
    .msg-item .msg-time{color:rgba(255,255,255,0.25);margin-right:5px;font-size:9px}
    .msg-item .msg-highlight{color:#4ade80;font-weight:600}.msg-item .msg-warn{color:#fbbf24;font-weight:600}.msg-item .msg-bad{color:#f87171;font-weight:600}

    .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:1000;display:none;justify-content:center;align-items:center;padding:16px}
    .modal-overlay.active{display:flex}
    .modal-container{background:linear-gradient(145deg,#1a1a2e,#0f0f1a);border:1px solid rgba(255,255,255,0.1);border-radius:20px;width:100%;max-width:1300px;max-height:88vh;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,0.6);animation:modalSlideUp .4s cubic-bezier(.16,1,.3,1)}
    @keyframes modalSlideUp{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
    .modal-header{padding:18px 22px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.02)}
    .modal-title{font-size:18px;font-weight:700;color:#fff;display:flex;align-items:center;gap:10px}
    .modal-title .icon{font-size:22px}
    .close-btn{width:36px;height:36px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(255,255,255,0.7);font-size:16px;cursor:pointer;transition:all .3s ease;display:flex;align-items:center;justify-content:center;min-height:44px;min-width:44px}
    .close-btn:hover{background:rgba(255,107,53,0.2);border-color:#ff6b35;color:#ff6b35;transform:rotate(90deg)}

    .market-tabs{display:flex;gap:6px;padding:12px 22px;background:rgba(0,0,0,0.2);border-bottom:1px solid rgba(255,255,255,0.05);overflow-x:auto;-webkit-overflow-scrolling:touch}
    .market-tab{padding:10px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:rgba(255,255,255,0.6);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;cursor:pointer;transition:all .3s ease;white-space:nowrap;display:flex;align-items:center;gap:6px;min-height:40px}
    .market-tab:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.9)}
    .market-tab.active{background:linear-gradient(135deg,var(--tab-color,#3498db),var(--tab-color-dark,#2980b9));border-color:var(--tab-color,#3498db);color:#fff;box-shadow:0 4px 16px rgba(var(--tab-color-rgb,52,152,219),0.3)}
    .market-tab .badge{padding:2px 6px;background:rgba(255,255,255,0.2);border-radius:5px;font-size:9px}

    .market-sub-tabs{display:none;gap:6px;padding:8px 22px;background:rgba(0,0,0,0.15);border-bottom:1px solid rgba(255,255,255,0.04)}
    .market-sub-tab{padding:8px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:rgba(255,255,255,0.5);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;cursor:pointer;transition:all .3s ease;white-space:nowrap;min-height:36px}
    .market-sub-tab:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.8)}
    .market-sub-tab.active{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.2);color:#fff}

    .market-info-bar{padding:10px 22px;background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.05);display:flex;justify-content:space-between;align-items:center}
    .market-description{font-size:11px;color:rgba(255,255,255,0.5);display:flex;align-items:center;gap:6px}
    .delivery-time{font-size:10px;color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.05);padding:4px 8px;border-radius:6px}
    .refresh-btn{padding:8px 14px;background:linear-gradient(135deg,#e67e22,#d35400);border:none;border-radius:8px;color:#fff;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;cursor:pointer;transition:all .3s ease;display:flex;align-items:center;gap:5px;min-height:36px}
    .refresh-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(230,126,34,0.4)}

    .vehicle-table-wrapper{max-height:calc(88vh - 220px);overflow-y:auto;padding:12px 22px 22px;-webkit-overflow-scrolling:touch}
    .vehicle-table{width:100%;border-collapse:separate;border-spacing:0}
    .vehicle-table thead{position:sticky;top:0;z-index:10}
    .vehicle-table th{padding:10px 12px;text-align:left;font-size:9px;font-weight:600;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px;background:rgba(0,0,0,0.3);border-bottom:1px solid rgba(255,255,255,0.08);cursor:pointer;white-space:nowrap;min-height:36px}
    .vehicle-table th:hover{color:rgba(255,255,255,0.7)}
    .vehicle-table th:first-child{border-radius:8px 0 0 0}.vehicle-table th:last-child{border-radius:0 8px 0 0}
    .vehicle-table tbody tr{transition:all .2s ease}.vehicle-table tbody tr:hover{background:rgba(255,255,255,0.03)}
    .vehicle-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;font-size:12px}
    .vehicle-info{display:flex;flex-direction:column;gap:2px}
    .vehicle-name{font-size:12px;font-weight:600;color:#fff}.vehicle-brand{font-size:10px;color:rgba(255,255,255,0.4)}
    .license-plate{font-family:'JetBrains Mono',monospace;font-size:11px;color:#60a5fa;background:rgba(96,165,250,0.1);padding:2px 6px;border-radius:4px;display:inline-block}
    .tag{display:inline-flex;align-items:center;gap:2px;padding:3px 6px;border-radius:5px;font-size:10px;font-weight:500}
    .tag-type{background:rgba(52,152,219,0.15);color:#3498db}.tag-fuel{background:rgba(39,174,96,0.15);color:#27ae60}
    .tag-used{background:rgba(230,126,34,0.15);color:#e67e22}.tag-exclusive{background:rgba(241,196,15,0.15);color:#f1c40f}
    .residual-value{display:flex;flex-direction:column;gap:2px}
    .residual-bar{width:60px;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden}
    .residual-fill{height:100%;border-radius:2px;transition:width .3s ease}
    .residual-text{font-size:9px;color:rgba(255,255,255,0.5)}
    .price{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#4ade80}
    .daily-rate{font-size:11px;color:rgba(255,255,255,0.6)}
    .action-btn{padding:8px 14px;border:none;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;cursor:pointer;transition:all .3s ease;min-height:36px}
    .btn-buy{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff}
    .btn-buy:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(39,174,96,0.4)}
    .btn-buy:disabled{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.3);cursor:not-allowed;transform:none;box-shadow:none}
    .btn-sell{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff}
    .btn-sell:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(231,76,60,0.4)}
    .btn-dispatch{background:linear-gradient(135deg,#3498db,#2980b9);color:#fff}
    .btn-dispatch:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(52,152,219,0.4)}
    .condition-tag{padding:2px 5px;border-radius:4px;font-size:9px;font-weight:500}
    .condition-优{background:rgba(39,174,96,0.2);color:#2ecc71}.condition-良{background:rgba(52,152,219,0.2);color:#3498db}
    .condition-一{background:rgba(241,196,15,0.2);color:#f1c40f}.condition-较{background:rgba(231,76,60,0.2);color:#e74c3c}
    .condition-excellent{background:rgba(39,174,96,0.2);color:#2ecc71}.condition-good{background:rgba(52,152,219,0.2);color:#3498db}
    .condition-average{background:rgba(241,196,15,0.2);color:#f1c40f}.condition-poor{background:rgba(231,76,60,0.2);color:#e74c3c}
    .outlet-select{padding:6px 8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:6px;color:#fff;font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer;outline:none;margin-top:3px;min-height:36px;width:100%}
    .outlet-select option{background:#1a1a2e;color:#fff}
    .rented-badge{background:rgba(251,191,36,0.2);color:#fbbf24;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
    .available-badge{background:rgba(74,222,128,0.2);color:#4ade80;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
    .transit-badge{background:rgba(59,130,246,0.2);color:#60a5fa;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
    .empty-state{padding:40px 20px;text-align:center;color:rgba(255,255,255,0.4)}.empty-state .icon{font-size:36px;margin-bottom:10px}.empty-state .text{font-size:12px}

    .order-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px 18px;margin-bottom:10px;transition:all .2s ease}
    .order-card:hover{background:rgba(255,255,255,0.06)}
    .order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
    .order-customer{display:flex;align-items:center;gap:8px}
    .order-avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
    .order-avatar.business{background:rgba(59,130,246,0.2)}.order-avatar.tourist{background:rgba(16,185,129,0.2)}
    .order-customer-info{display:flex;flex-direction:column;gap:1px}
    .order-customer-name{font-size:12px;font-weight:600;color:#fff}
    .order-customer-type{font-size:10px;color:rgba(255,255,255,0.4)}
    .order-price{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:#4ade80}
    .order-details{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
    .order-detail-item{background:rgba(255,255,255,0.03);border-radius:6px;padding:6px 8px}
    .order-detail-label{font-size:9px;color:rgba(255,255,255,0.35);margin-bottom:1px}
    .order-detail-value{font-size:11px;color:rgba(255,255,255,0.7);font-weight:500}
    .order-actions{display:flex;gap:6px}
    .order-actions .action-btn{flex:1;padding:10px;text-align:center}
    .btn-accept{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff}
    .btn-accept:hover{box-shadow:0 4px 16px rgba(39,174,96,0.4);transform:translateY(-1px)}
    .btn-reject{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.1)}
    .btn-reject:hover{background:rgba(231,76,60,0.2);color:#e74c3c;border-color:#e74c3c}
    .order-list-wrapper{max-height:calc(88vh - 100px);overflow-y:auto;padding:16px 22px 22px}

    .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);padding:12px 20px;border-radius:10px;font-size:12px;font-weight:500;z-index:2000;opacity:0;transition:all .4s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;gap:8px}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
    .toast.success{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;box-shadow:0 10px 40px rgba(39,174,96,0.4)}
    .toast.error{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;box-shadow:0 10px40px rgba(231,76,60,0.4)}
    .toast.warning{background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff;box-shadow:0 10px 40px rgba(243,156,18,0.4)}

    #outlet-popup{position:fixed;z-index:200;display:none;width:300px;background:rgba(15,15,26,0.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,0.6)}
    #outlet-popup.active{display:block}
    .popup-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .popup-close{background:none;border:none;color:rgba(255,255,255,0.5);cursor:pointer;font-size:14px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
    .popup-close:hover{color:#fff}
    .popup-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
    .popup-stat{background:rgba(255,255,255,0.05);border-radius:6px;padding:6px 8px}
    .popup-stat-label{font-size:9px;color:rgba(255,255,255,0.4)}.popup-stat-value{font-size:12px;font-weight:700;color:#fff}
    .popup-vehicles{max-height:160px;overflow-y:auto}
    .popup-vehicle-item{padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:11px;color:rgba(255,255,255,0.7);display:flex;justify-content:space-between}
    .popup-vehicle-item:last-child{border-bottom:none}
    .popup-actions{margin-top:10px;display:flex;gap:6px}
    .popup-btn{flex:1;padding:8px;border:none;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;cursor:pointer;transition:all .2s ease;text-align:center;min-height:40px}
    .popup-btn-upgrade{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff}
    .popup-btn-upgrade:hover{box-shadow:0 4px 12px rgba(39,174,96,0.4)}
    .popup-btn-upgrade:disabled{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.3);cursor:not-allowed}
    .popup-btn-unlock{background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff}
    .popup-btn-unlock:hover{box-shadow:0 4px 12px rgba(243,156,18,0.4)}

    .dispatch-modal-content{padding:20px 22px}
    .dispatch-info{background:rgba(255,255,255,0.04);border-radius:10px;padding:14px;margin-bottom:14px}
    .dispatch-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px}
    .dispatch-label{color:rgba(255,255,255,0.5)}.dispatch-value{color:#fff;font-weight:600}
    .dispatch-value.cost{color:#fbbf24}.dispatch-value.time{color:#60a5fa}
    .dispatch-select-wrap{margin-bottom:14px}
    .dispatch-select-wrap label{display:block;font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:5px}
    .dispatch-select{width:100%;padding:10px 12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;outline:none;min-height:44px}
    .dispatch-select option{background:#1a1a2e;color:#fff}
    .dispatch-actions{display:flex;gap:8px}
    .dispatch-actions .action-btn{flex:1;padding:12px;text-align:center}
    .btn-confirm-dispatch{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff}
    .btn-confirm-dispatch:hover{box-shadow:0 4px 16px rgba(59,130,246,0.4);transform:translateY(-1px)}
    .btn-confirm-dispatch:disabled{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.3);cursor:not-allowed;transform:none;box-shadow:none}
    .btn-cancel-dispatch{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.1)}
    .btn-cancel-dispatch:hover{background:rgba(231,76,60,0.2);color:#e74c3c;border-color:#e74c3c}

    .status-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
    .status-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
    .status-label{font-size:9px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:.5px}
    .status-value{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:#fff}

    .rate-slider{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,0.1);outline:none;min-height:44px}
    .rate-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#4ade80,#22c55e);cursor:pointer;box-shadow:0 2px 8px rgba(74,222,128,0.4)}
    .rate-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#4ade80,#22c55e);cursor:pointer;border:none}

    #tutorialOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);z-index:3000;display:none;justify-content:center;align-items:center;padding:20px}
    #tutorialOverlay.active{display:flex}
    .tutorial-box{background:linear-gradient(145deg,#1a1a2e,#0f0f1a);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:32px;max-width:460px;width:100%;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,0.6)}
    .tutorial-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:16px}
    .tutorial-text{font-size:13px;color:rgba(255,255,255,0.7);line-height:1.8;margin-bottom:24px}
    .tutorial-dots{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
    .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.15);transition:all .3s ease}
    .dot.active{background:#ff6b35;transform:scale(1.3)}.dot.done{background:#4ade80}
    .tutorial-step-num{font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:12px}
    .tutorial-btns{display:flex;gap:10px;justify-content:center}
    .tutorial-btn{padding:12px 24px;border:none;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;cursor:pointer;transition:all .3s ease;min-height:44px}
    .tutorial-btn-primary{background:linear-gradient(135deg,#ff6b35,#f7931e);color:#fff}
    .tutorial-btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,107,53,0.4)}
    .tutorial-btn-skip{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.1)}
    .tutorial-btn-skip:hover{color:rgba(255,255,255,0.8)}

    @media(max-width:768px){
      #control-panel{bottom:8px;right:8px;left:8px;min-width:auto;padding:12px 14px;border-radius:12px}
      #control-panel h2{font-size:12px;margin-bottom:6px;padding-bottom:6px}
      .stat{padding:3px 0}.stat-label{font-size:10px}.stat-value{font-size:11px}
      .panel-btn{padding:8px 10px;font-size:11px;min-height:40px}
      #message-log{top:8px;left:8px;width:calc(100% - 16px);max-height:160px;border-radius:10px}
      .msg-header{padding:8px 10px;font-size:10px}
      .msg-item{padding:4px 10px;font-size:10px}
      .modal-container{max-width:100%;max-height:95vh;border-radius:14px}
      .modal-header{padding:14px 16px}.modal-title{font-size:15px}
      .market-tabs{padding:8px 14px;gap:4px}.market-tab{padding:8px 12px;font-size:10px;min-height:36px}
      .vehicle-table td{padding:8px 8px;font-size:11px}.vehicle-table th{padding:8px 8px;font-size:8px}
      .vehicle-name{font-size:11px}.vehicle-brand{font-size:9px}
      .status-grid{grid-template-columns:repeat(2,1fr)}
      #outlet-popup{width:calc(100% - 32px);left:16px!important}
      .order-details{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>
  <div id="loading-screen"><div class="loader"></div><div class="loading-text">INITIALIZING</div></div>
  <div id="canvas-container"></div>

  <div id="message-log">
    <div class="msg-header"><span>📋 经营日志</span><button class="msg-clear" onclick="clearMessages()">清空</button></div>
    <div class="msg-body" id="messageBody"></div>
  </div>

  <div id="control-panel">
    <h2>租车公司</h2>
    <div class="stat"><span class="stat-label">日期</span><span class="stat-value" id="dayDisplay">2023年1月1日 周日</span></div>
    <div class="stat"><span class="stat-label">公司现金</span><span class="stat-value cash" id="cash">$1,000,000</span></div>
    <div class="stat"><span class="stat-label">总车队</span><span class="stat-value fleet" id="fleet">0 辆</span></div>
    <div class="stat"><span class="stat-label">今日收入</span><span class="stat-value income" id="todayIncome">$0</span></div>
    <div class="stat"><span class="stat-label">今日支出</span><span class="stat-value expense" id="todayExpense">$0</span></div>
    <div id="marketCoeffDisplay">市场系数: 1.00</div>
    <div id="activeEventsBar"></div>
    <button class="panel-btn next-day" onclick="nextDay()">⏭ 下一日</button>
    <button class="panel-btn orders" onclick="openOrdersModal()">📋 待处理订单<span class="order-badge" id="orderBadge"></span></button>
    <button class="panel-btn fleet" onclick="openFleetModal()">🚗 车队管理</button>
    <button class="panel-btn pricing" onclick="openPricingModal()">💰 调价</button>
  </div>

  <div id="outlet-popup">
    <div class="popup-title"><span id="popupName"></span><button class="popup-close" onclick="hideOutletPopup()">✕</button></div>
    <div class="popup-stats">
      <div class="popup-stat"><div class="popup-stat-label">城市规模</div><div class="popup-stat-value" id="popupCity"></div></div>
      <div class="popup-stat"><div class="popup-stat-label">车位</div><div class="popup-stat-value" id="popupCapacity"></div></div>
      <div class="popup-stat"><div class="popup-stat-label">今日订单</div><div class="popup-stat-value" id="popupOrders"></div></div>
      <div class="popup-stat"><div class="popup-stat-label">等级</div><div class="popup-stat-value" id="popupLevel"></div></div>
    </div>
    <div style="font-size:10px;color:rgba(255,255,255,0.4);margin-bottom:4px;">在库车辆</div>
    <div class="popup-vehicles" id="popupVehicles"></div>
    <div class="popup-actions" id="popupActions"></div>
  </div>

  <div class="modal-overlay" id="fleetModal">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-title"><span class="icon">🚗</span> 车队管理系统</div>
        <button class="close-btn" onclick="closeFleetModal()">✕</button>
      </div>
      <div class="market-tabs">
        <button class="market-tab active" data-tab="myvehicles" onclick="switchTab('myvehicles')" style="--tab-color:#2ecc71;--tab-color-dark:#27ae60;--tab-color-rgb:46,204,113;">🚗 我的车辆 <span class="badge" id="myFleetCount">0辆</span></button>
        <button class="market-tab" data-tab="market" onclick="switchTab('market')" style="--tab-color:#3498db;--tab-color-dark:#2980b9;--tab-color-rgb:52,152,219;">🏪 车辆市场</button>
        <button class="market-tab" data-tab="status" onclick="switchTab('status')" style="--tab-color:#f39c12;--tab-color-dark:#e67e22;--tab-color-rgb:243,156,18;">📊 车辆状态</button>
        <button class="market-tab" data-tab="outlets" onclick="switchTab('outlets')" style="--tab-color:#e74c3c;--tab-color-dark:#c0392b;--tab-color-rgb:231,76,60;">🏢 网点管理 <span class="badge" id="outletCount">1个</span></button>
        <button class="market-tab" data-tab="pricing" onclick="switchTab('pricing')" style="--tab-color:#9b59b6;--tab-color-dark:#8e44ad;--tab-color-rgb:155,89,182;">💰 调价管理</button>
      </div>
      <div class="market-sub-tabs" id="marketSubTabs">
        <button class="market-sub-tab active" data-sub="local" onclick="switchMarketSubTab('local')">🏪 本地经销商 <span id="localCount">22辆</span></button>
        <button class="market-sub-tab" data-sub="used" onclick="switchMarketSubTab('used')">🚗 二手车 <span id="usedCount">0辆</span></button>
        <button class="market-sub-tab" data-sub="overseas" onclick="switchMarketSubTab('overseas')">🌍 海外进口 <span id="overseasCount">12辆</span></button>
      </div>
      <div class="market-info-bar" id="marketInfoBar">
        <div class="market-description" id="marketDescription">批量采购享95折优惠，即时交付</div>
        <div style="display:flex;gap:6px;align-items:center;">
          <div class="delivery-time" id="deliveryTime">⚡ 即时交付</div>
          <button class="refresh-btn" id="refreshUsedBtn" style="display:none;" onclick="refreshUsedCarMarket()">🔄 刷新</button>
        </div>
      </div>
      <div class="vehicle-table-wrapper">
        <table class="vehicle-table" id="vehicleTable">
          <thead><tr><th>车型</th><th>车牌</th><th>类型</th><th>网点</th><th>状态</th><th>日租金</th><th>操作</th></tr></thead>
          <tbody id="vehicleTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="ordersModal">
    <div class="modal-container" style="max-width:650px;">
      <div class="modal-header">
        <div class="modal-title"><span class="icon">📋</span> 待处理订单</div>
        <button class="close-btn" onclick="closeOrdersModal()">✕</button>
      </div>
      <div class="order-list-wrapper" id="orderListWrapper">
        <div class="empty-state"><div class="icon">📭</div><div class="text">暂无待处理订单</div></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="dispatchModal">
    <div class="modal-container" style="max-width:460px;">
      <div class="modal-header">
        <div class="modal-title"><span class="icon">🚚</span> 车辆调度</div>
        <button class="close-btn" onclick="closeDispatchModal()">✕</button>
      </div>
      <div class="dispatch-modal-content" id="dispatchContent"></div>
    </div>
  </div>

  <div class="modal-overlay" id="pricingModal">
    <div class="modal-container" style="max-width:600px;">
      <div class="modal-header">
        <div class="modal-title"><span class="icon">💰</span> 租金调价</div>
        <button class="close-btn" onclick="closePricingModal()">✕</button>
      </div>
      <div class="vehicle-table-wrapper" id="pricingContent"></div>
    </div>
  </div>

  <div id="tutorialOverlay">
    <div class="tutorial-box">
      <div class="tutorial-step-num" id="tutorialStepNum">1 / 7</div>
      <div class="tutorial-title" id="tutorialTitle">👋 欢迎！</div>
      <div class="tutorial-text" id="tutorialText"></div>
      <div class="tutorial-dots" id="tutorialDots"></div>
      <div class="tutorial-btns">
        <button class="tutorial-btn tutorial-btn-skip" onclick="skipTutorial()">跳过</button>
        <button class="tutorial-btn tutorial-btn-primary" id="tutorialAction" onclick="nextTutorialStep()">开始</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="js/vehicles.js"></script>
  <script src="js/game-core.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/scene3d.js"></script>
  <script src="js/ui.js"></script>

  <script>
    function openPricingModal() {
      document.getElementById('pricingModal').classList.add('active');
      renderPricingInline();
    }
    function closePricingModal() { document.getElementById('pricingModal').classList.remove('active'); }

    function renderPricingInline() {
      var content = document.getElementById('pricingContent');
      var types = Object.values(VEHICLE_TYPES);
      var html = '<table class="vehicle-table"><thead><tr><th>车型</th><th>数量</th><th>租金倍率</th><th>范围</th><th>生效</th><th>操作</th></tr></thead><tbody>';
      types.forEach(function(type){
        var mult = getRateMultiplier(type);
        var count = gameState.ownedVehicles.filter(function(v){ return v.type === type; }).length;
        if (count === 0 && mult === 1.0) return;
        html += '<tr><td><span class="tag tag-type">' + type + '</span></td><td>' + count + ' 辆</td>' +
          '<td><div style="display:flex;align-items:center;gap:8px;"><input type="range" min="50" max="200" value="' + Math.round(mult * 100) + '" class="rate-slider" id="pRateSlider_' + type + '" oninput="updatePRateDisplay(\'' + type + '\',this.value)"><span id="pRateDisplay_' + type + '" style="font-family:JetBrains Mono,monospace;font-size:14px;font-weight:700;color:#4ade80;min-width:40px;">' + mult.toFixed(1) + 'x</span></div></td>' +
          '<td><span style="font-size:10px;color:rgba(255,255,255,0.4);">0.5x ~ 2.0x</span></td>' +
          '<td><span style="font-size:10px;color:rgba(255,255,255,0.4);">次日生效</span></td>' +
          '<td><button class="action-btn btn-buy" onclick="confirmPRateChange(\'' + type + '\')">确认</button></td></tr>';
      });
      html += '</tbody></table>';
      if (gameState.ownedVehicles.length === 0) {
        html = '<div class="empty-state"><div class="icon">💰</div><div class="text">购买车辆后可调整租金倍率</div></div>';
      }
      html += '<div style="margin-top:16px;padding:12px;background:rgba(255,255,255,0.04);border-radius:10px;">' +
        '<div style="font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:6px;">💡 提示</div>' +
        '<div style="font-size:10px;color:rgba(255,255,255,0.4);line-height:1.6;">' +
        '• 竞争对手每周调整市场系数（0.8~1.2），影响所有车辆基础租金<br>' +
        '• 当前市场系数: <span style="color:' + (gameState.marketCoefficient >= 1.0 ? '#4ade80' : '#f87171') + ';">' + gameState.marketCoefficient.toFixed(2) + '</span><br>' +
        '• 调价后次日生效，合理定价可提高客户下单率</div></div>';
      content.innerHTML = html;
    }

    function updatePRateDisplay(type, value) {
      var display = document.getElementById('pRateDisplay_' + type);
      if (display) display.textContent = (value / 100).toFixed(1) + 'x';
    }

    function confirmPRateChange(type) {
      var slider = document.getElementById('pRateSlider_' + type);
      if (!slider) return;
      var newMult = parseInt(slider.value) / 100;
      setRateMultiplier(type, newMult);
      addMessage('💰 ' + type + ' 租金倍率调整为 ' + newMult.toFixed(1) + 'x，次日生效', 'warn');
      showToast(type + ' 租金倍率已调整为 ' + newMult.toFixed(1) + 'x', 'success');
      renderPricingInline();
    }

    window.addEventListener('keydown', function(e){
      if (e.key === 'Escape') { closeFleetModal(); closeOrdersModal(); closeDispatchModal(); closePricingModal(); hideOutletPopup(); }
    });

    window.addEventListener('DOMContentLoaded', function(){
      initRateMultipliers();
      var loaded = loadGame();
      init3D();
      if (loaded && gameState.messages.length > 0) {
        renderMessages();
      } else {
        addMessage('欢迎来到租车公司模拟！', 'good');
      }
      if (gameState.usedCarMarketList.length === 0) {
        gameState.usedCarMarketList = generateUsedCarListing(20);
      }
      updateUI();
      saveGame();
      if (gameState.tutorialStep < 7) {
        setTimeout(showTutorial, 1200);
      }
    });
  </script>
</body>
</html>
